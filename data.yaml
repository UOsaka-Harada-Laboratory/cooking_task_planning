# Paper Content Sections
# Sections will be rendered in the order defined below.
# If a section is removed from here, it will automatically disappear from the page and navbar.
sections:
  - id: "abstract"
    title: "Abstract"
    nav_label: "Abstract"
    content: "Cooking tasks remain a challenging problem for robotics due to their complexity. Videos of people cooking are a valuable source of information for such task, but introduces a lot of variability in terms of how to translate this data to a robotic environment. This research aims to streamline this process, focusing on the task plan generation step, by using a Large Language Model (LLM)-based Task and Motion Planning (TAMP) framework to autonomously generate cooking task plans from videos with subtitles, and execute them. Conventional LLM-based task planning methods are not well-suited for interpreting the cooking video data due to uncertainty in the videos, and the risk of hallucination in its output. To address both of these problems, we explore using LLMs in combination with Functional Object-Oriented Networks (FOON), to validate the plan and provide feedback in case of failure. This combination can generate task sequences with manipulation motions that are logically correct and executable by a robot. We compare the execution of the generated plans for 5 cooking recipes from our approach against the plans generated by a few-shot LLM-only approach for a dual-arm robot setup. It could successfully execute 4 of the plans generated by our approach, whereas only 1 of the plans generated by solely using the LLM could be executed."
    components:
      - type: "youtube_video"
        title: "Demo Video"
        url: "https://www.youtube.com/watch?v=n3spw0j8oZs"
        description: "Planning and executing the cooking task for a pork rice bowl."

  # - id: "introduction"
  #   title: "Introduction"
  #   nav_label: "Introduction"
  #   content: "TODO: Add Introduction"

   - id: "methodology"
    title: "Methodology"
    nav_label: "Methodology"
    content: "Our method proposes to plan cooking tasks from videos with subtitles by using LLMs. From the video, the LLM is prompted to generate Target Object Nodes, a structured representation (Functional Unit) of an action, the required tools and the object transformation after the action. Then, another LLM instance is given information of the current environment as an Environment Object Node, and tasked with predicting the actions to achieve the same state as the Target Object Node. This structure allows us to construct a Functional Object-Oriented Network (FOON), which is a structured graph representation that allows us validate the actions and re-plan in case of failures."
    list_type: "bullet" # Options: bullet, number, check, arrow, star, circle, square, none
    list:
      - "1. Video Segmentation via OCR"
      - "2. Prompt the LLM to generate the Target Object Node"
      - "3. Prompt the LLM to predict the actions that take the current Environment Object Node to the Target Object Node"
      - "4. Add node to the graph for validation"
      - "5. Re-plan if failure, otherwise perform motion planning."
    components:
      - type: "image_carousel"
        title: "Steps"
        images:
          - "Assets/Fig1.png"
          - "Assets/Fig2.png"
          - "Assets/Fig3.png"
          - "Assets/Fig6.png"
          - "Assets/Fig7.png"
          - "Assets/Fig8.png"
          - "Assets/motion_planning.png"

