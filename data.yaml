  - id: "conclusion"
    title: "Conclusion"
    nav_label: "Conclusion"
    content: "Testing for 5 full cooking tasks, our method could successfully generate feasible plans for 4 of them, while a baseline using few-shot prompting for direct task planning, without the graph validation, only generated 1 successful plan."

